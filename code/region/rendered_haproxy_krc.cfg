global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 10s
    timeout client 30m
    timeout server 30m

frontend mysql_front
    bind *:3306
    default_backend mysql_servers

resolvers azure_dns
    nameserver azure 168.63.129.16:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

backend mysql_servers
    mode tcp
    balance first
    option tcp-check
    server mysql_active 192.168.10.203:3306 check inter 3s fall 2 rise 2
    server mysql_standby 07-3team-mysql-krc1.mysql.database.azure.com:3306 check resolvers azure_dns init-addr none inter 3s fall 2 rise 2 backup
